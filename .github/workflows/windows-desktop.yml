name: Windows desktop preview

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'apps/overlay/**'
      - 'apps/manager/**'
      - 'adapters/cs2/**'
      - 'services/engine/**'
      - 'packages/protocol/**'
      - 'package.json'
      - '.github/workflows/windows-desktop.yml'

permissions:
  contents: read

jobs:
  portable:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: npm install --no-audit --no-fund
      - name: Run checks
        run: npm run check
      - name: Run tests
        run: npm test
      - name: Build portable Windows x64 preview
        run: npm run package:win
      - name: Smoke test packaged Electron desktop startup and shutdown
        shell: pwsh
        run: ./apps/desktop/scripts/smoke-windows.ps1
      - name: Create SHA-256 checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -Filter *.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "$hash  $($_.Name)" | Add-Content dist/SHA256SUMS.txt
          }
      - uses: actions/upload-artifact@v4
        with:
          name: anocore-broadcast-windows-preview
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
